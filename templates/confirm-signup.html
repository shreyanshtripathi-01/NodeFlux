<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:'Courier New',Courier,monospace">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafafa">
    <tr>
      <td align="center" style="padding:40px 16px">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:2px solid #000000;border-radius:8px">
          <tr>
            <td style="padding:48px 40px 32px;text-align:center">
              <span style="font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#000000;text-decoration:none">/nodeflux.</span>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 8px;text-align:center">
              <h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.025em;color:#000000;font-family:'Courier New',Courier,monospace">Confirm your email</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 28px;text-align:center">
              <p style="margin:0;font-size:14px;color:#737373;line-height:1.5;font-family:'Courier New',Courier,monospace">
                Enter this code to verify your account
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 32px;text-align:center">
              <div style="font-size:36px;font-weight:700;letter-spacing:12px;color:#000000;background-color:#fafafa;border:1px solid #e5e5e5;border-radius:6px;padding:20px 24px;display:inline-block;font-family:'Courier New',Courier,monospace">
                {{ .Token }}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:0 40px 8px;text-align:center">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#000000;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:14px 40px;border-radius:6px;font-family:'Courier New',Courier,monospace">
                Verify Email
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 0;text-align:center">
              <p style="margin:0;font-size:12px;color:#a3a3a3;line-height:1.5;font-family:'Courier New',Courier,monospace">
                Or click the link: <a href="{{ .ConfirmationURL }}" style="color:#000000;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 40px 0;text-align:center">
              <p style="margin:0;font-size:12px;color:#a3a3a3;line-height:1.5;font-family:'Courier New',Courier,monospace">
                This code expires in 24 hours.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 40px 0;border-top:1px solid #e5e5e5;text-align:center">
              <p style="margin:0;font-size:11px;color:#a3a3a3;line-height:1.5;font-family:'Courier New',Courier,monospace">
                If you didn&rsquo;t create an account, you can safely ignore this email.
              </p>
              <p style="margin:8px 0 0;font-size:11px;color:#a3a3a3;font-family:'Courier New',Courier,monospace">
                &copy; NodeFlux &mdash; AI workflow builder
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
